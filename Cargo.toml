[package]
name = "peribattery"
version = "0.2.0"
edition = "2021"
description = "Battery of wireless peripherals on the Windows 11 taskbar"
license = "MIT"
build = "build.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
] }
windows = { version = "0.58", features = ["Gaming_Input", "Devices_Power", "System_Power", "Foundation", "Foundation_Collections"] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
